<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="The big picture"><style>text{font:13px ui-sans-serif,system-ui,sans-serif;fill:#1d2330}.b{font-weight:700}.s{font-size:11.5px;fill:#5d6678}.t{font:700 12px ui-sans-serif;fill:#5d6678;letter-spacing:.06em}.bm{fill:#fbeee4;stroke:#b4531f;stroke-width:1.8}.bc{fill:#e6f0f8;stroke:#1f5f8b;stroke-width:1.8}.bn{fill:#fff;stroke:#9a9484;stroke-width:1.4}.bg{fill:#e5f3ea;stroke:#2d7a4b;stroke-width:1.8}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker></defs><text x="20" y="22" class="t">1 · BUILD THE EDIT</text><rect x="20" y="40" width="120" height="60" rx="9" class="bn"/><text x="80.0" y="62" text-anchor="middle" class="b">REQUEST</text><text x="80.0" y="80" text-anchor="middle" class="s">user’s sentence</text><rect x="190" y="40" width="150" height="60" rx="9" class="bm"/><text x="265.0" y="62" text-anchor="middle" class="b">MODEL</text><text x="265.0" y="80" text-anchor="middle" class="s">reads the request</text><rect x="390" y="40" width="150" height="60" rx="9" class="bn"/><text x="465.0" y="62" text-anchor="middle" class="b">OPERATION</text><text x="465.0" y="80" text-anchor="middle" class="s">move · add · remove</text><rect x="590" y="40" width="130" height="60" rx="9" class="bn"/><text x="655.0" y="62" text-anchor="middle" class="b">BLANKS</text><text x="655.0" y="80" text-anchor="middle" class="s">what is still unknown</text><rect x="770" y="40" width="210" height="60" rx="9" class="bn"/><text x="875.0" y="62" text-anchor="middle" class="b">FILLERS</text><text x="875.0" y="80" text-anchor="middle" class="s">each blank gets one</text><path d="M140 70 H190" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M340 70 H390" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M540 70 H590" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M720 70 H770" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="352" y="62" class="s">picks</text><text x="552" y="62" class="s">has</text><text x="745" y="62" text-anchor="middle" class="s">filled by</text><path d="M875 100 V128" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="770" y="130" width="210" height="34" rx="9" class="bn"/><text x="875.0" y="152.0" text-anchor="middle" class="b">user’s words</text><rect x="770" y="172" width="210" height="52" rx="9" class="bc"/><text x="875.0" y="194" text-anchor="middle" class="b">lookup</text><text x="875.0" y="212" text-anchor="middle" class="s">reads R1 IDs, R2 links</text><rect x="770" y="232" width="210" height="56" rx="9" class="bc"/><text x="875.0" y="252" text-anchor="middle" class="b">relation engine</text><text x="875.0" y="268" text-anchor="middle" class="s">answers F2 along · F3 across</text><text x="875.0" y="282" text-anchor="middle" class="s">F4 facing</text><rect x="770" y="296" width="210" height="52" rx="9" class="bg"/><text x="875.0" y="318" text-anchor="middle" class="b">ask the user</text><text x="875.0" y="336" text-anchor="middle" class="s">when a blank cannot be filled</text><path d="M770 198 H745 V500" stroke="#1f5f8b" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#g)"/><path d="M770 260 H722 V500" stroke="#1f5f8b" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#g)"/><text x="762" y="470" class="s" style="fill:#1f5f8b" transform="rotate(-90 762 470)">reads the IR</text><rect x="450" y="290" width="230" height="60" rx="9" class="bn"/><text x="565.0" y="312" text-anchor="middle" class="b">THE EDIT</text><text x="565.0" y="330" text-anchor="middle" class="s">every blank filled,</text><text x="565.0" y="345" text-anchor="middle" class="s">each value with its origin</text><path d="M770 322 H680" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="20" y="372" class="t">2 · CHECK THE EDIT</text><rect x="450" y="390" width="230" height="60" rx="9" class="bc"/><text x="565.0" y="412" text-anchor="middle" class="b">RULES / JUDGE</text><text x="565.0" y="430" text-anchor="middle" class="s">asks F1–F5 (whichever apply)</text><text x="565.0" y="445" text-anchor="middle" class="s">compares before vs after</text><path d="M565 350 V390" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="300" y="395" width="120" height="50" rx="9" class="bg"/><text x="360.0" y="425.0" text-anchor="middle" class="b">pass / fail</text><path d="M450 420 H420" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M565 450 V500" stroke="#1f5f8b" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#g)"/><text x="575" y="482" class="s" style="fill:#1f5f8b">reads the IR</text><rect x="190" y="230" width="230" height="70" rx="9" class="bm"/><text x="305.0" y="252" text-anchor="middle" class="b">E1–E4  the window</text><text x="305.0" y="270" text-anchor="middle" class="s">small local graph; “Q2” references,</text><text x="305.0" y="285" text-anchor="middle" class="s">never typed numbers</text><path d="M240 230 V100" stroke="#1d2330" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M240 500 V300" stroke="#b4531f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="20" y="266" class="s">how the model</text><text x="20" y="281" class="s">sees the map</text><rect x="20" y="500" width="960" height="130" rx="10" class="bc"/><text x="500" y="526" text-anchor="middle" class="b" style="fill:#1f5f8b">THE IR  ·  the one internal map  ·  3 · THE GROUND</text><rect x="36" y="544" width="176" height="62" rx="8" class="bn"/><text x="124" y="570" text-anchor="middle" class="b">R1</text><text x="124" y="588" text-anchor="middle" class="s">permanent IDs</text><rect x="224" y="544" width="176" height="62" rx="8" class="bn"/><text x="312" y="570" text-anchor="middle" class="b">R2</text><text x="312" y="588" text-anchor="middle" class="s">links as edges</text><rect x="412" y="544" width="176" height="62" rx="8" class="bn"/><text x="500" y="570" text-anchor="middle" class="b">R3</text><text x="500" y="588" text-anchor="middle" class="s">shape stored twice</text><rect x="600" y="544" width="176" height="62" rx="8" class="bn"/><text x="688" y="570" text-anchor="middle" class="b">R4</text><text x="688" y="588" text-anchor="middle" class="s">start and end of every value</text><rect x="788" y="544" width="176" height="62" rx="8" class="bn"/><text x="876" y="570" text-anchor="middle" class="b">R5</text><text x="876" y="588" text-anchor="middle" class="s">who said it</text><text x="20" y="646" class="s">Blue = code. Orange = model. Green = outcome / asking the user.</text></svg>